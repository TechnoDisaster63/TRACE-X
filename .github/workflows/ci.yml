name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Tests and compile (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked test dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt'
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile Python sources and tests
        run: python -m compileall -q core modules cli.py tests
      - name: Run full test suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q
